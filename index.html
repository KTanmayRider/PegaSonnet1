<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Shopify Store - Premium Products & Fast Shipping</title>
    <meta name="title" content="Shopify Store - Premium Products & Fast Shipping" />
    <meta name="description" content="Discover amazing products with exceptional quality. Shop our curated collection with fast shipping and excellent customer service." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shopify Store - Premium Products & Fast Shipping" />
    <meta property="og:description" content="Discover amazing products with exceptional quality. Shop our curated collection with fast shipping and excellent customer service." />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Shopify Store - Premium Products & Fast Shipping" />
    <meta property="twitter:description" content="Discover amazing products with exceptional quality. Shop our curated collection with fast shipping and excellent customer service." />
    
    <!-- Accessibility -->
    <meta name="theme-color" content="#3B82F6" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
  <body>
    <!-- Main app container with ARIA landmark -->
    <div id="root" role="application"></div>
    
    <!-- JavaScript module entry point -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Noscript fallback for accessibility -->
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: system-ui, -apple-system, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>This application requires JavaScript to be enabled. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </body>
</html>
